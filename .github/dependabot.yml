version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
