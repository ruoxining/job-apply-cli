[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "job-apply-cli"
version = "0.1.0"
description = "Safety-first dual-channel job discovery and application orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.14,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
  "python-telegram-bot>=21.9,<23",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=5.1,<6", "torch>=2.2,<3"]
browser = [
    "cua-driver>=0.26,<0.27",
    "playwright>=1.49,<2",
]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]
[project.scripts]
job-apply-cli = "job_apply_agent.cli:main"
job-apply-agent = "job_apply_agent.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.15,<1",
  "mypy>=1.19,<2",
  "bandit[toml]>=1.9,<2",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_apply_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/alembic",
  "/README.md", "/README.en.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/alembic.ini",
  "/Dockerfile", "/docker-compose.yml", "/docker-compose.dev.yml",
  "/.github", "/.python-version", "/CONTRIBUTING.md", "/CHANGELOG.md",
  "/release-please-config.json", "/.release-please-manifest.json",
  "/.env.example", "/.gitignore", "/.dockerignore", "/public-files.txt",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store", "**/*.private.*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.coverage.run]
source = ["job_apply_agent"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = ["src/job_apply_agent"]

# Keep server retrieval CPU-only; do not download the CUDA runtime for this feature.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
