name: Bug report / 问题反馈
description: Reproducible CLI or workflow failure / 可复现的 CLI 或工作流问题
body:
  - type: markdown
    attributes:
      value: 'Use synthetic data. Remove tokens, resumes, applicant answers and personal paths. / 请使用合成数据，并移除密钥、简历、个人答案及路径。'
  - type: textarea
    id: environment
    attributes:
      label: Version and environment / 版本与环境
      description: Package version, Python, OS and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Exact command, synthetic input, expected and observed output, exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / 脱敏日志
