name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.18'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
      - run: uv sync --locked --python 3.12 --extra test --extra browser
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen bandit -r src scripts -ll
      - run: uv run --frozen python scripts/export_public.py --check
      - run: uv run --frozen python scripts/check_repository.py
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest
      - run: node --test tests/lcu_fixture_policy.test.mjs
      - name: Audit locked dependencies including optional features
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes > /tmp/dependencies-locked.txt
          # PyPI advisories use the public version for the official PyTorch CPU wheel.
          # Preserve every requirement/marker; normalize only torch's known +cpu suffix.
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          requirements = Path("/tmp/dependencies-locked.txt").read_text()
          requirements = re.sub(r"(?m)^(torch==[^;+\s]+)\+cpu(?=\s*(?:;|$))", r"\1", requirements)
          Path("/tmp/dependencies.txt").write_text(requirements)
          PYTHON
          uv run --frozen pip-audit --strict --no-deps --disable-pip -r /tmp/dependencies.txt

  build:
    uses: ./.github/workflows/package.yml

  validate:
    if: always()
    needs: [checks, build, review-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          REVIEW: ${{ needs.review-contract.result }}
        run: test "$CHECKS" = success && test "$BUILD" = success && test "$REVIEW" = success

  review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.18'
          enable-cache: false
      - run: python3 scripts/install_reviewer.py --venv /tmp/pr-agent-venv
      - run: /tmp/pr-agent-venv/bin/python scripts/check_review_contract.py
      - run: uvx --python 3.12 pip-audit==2.10.1 --strict --path /tmp/pr-agent-venv/lib/python3.12/site-packages
