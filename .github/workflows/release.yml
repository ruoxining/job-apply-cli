name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require successful CI on current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)
          result=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
          test "$result" = success
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
      - name: Verify the bot-created release PR, then dispatch advisory review
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er .headBranchName <<< "$RELEASE_PR")
          pr=$(jq -er .number <<< "$RELEASE_PR")
          runs="repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=$branch&event=workflow_dispatch&per_page=1"
          previous=$(gh api "$runs" --jq '.workflow_runs[0].id // 0')
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"
          passed=false
          for ((attempt = 0; attempt < 90; attempt++)); do
            read -r run_id status conclusion sha <<< "$(gh api "$runs" --jq '.workflow_runs[0] | [(.id // 0), (.status // "missing"), (.conclusion // "pending"), (.head_sha // "missing")] | @tsv')"
            printf 'CI attempt %s: run=%s status=%s conclusion=%s commit=%s\n' "$attempt" "$run_id" "$status" "$conclusion" "$sha"
            if [ "$run_id" -gt "$previous" ] && [ "$status" = completed ]; then
              test "$conclusion" = success
              passed=true
              break
            fi
            sleep 10
          done
          test "$passed" = true
          current=$(gh api "repos/$REPOSITORY/pulls/$pr" --jq .head.sha)
          test "$current" = "$sha"
          # Explicit dispatch also works when GitHub suppresses a downstream workflow_run.
          gh workflow run ai-review.yml --repo "$REPOSITORY" --ref main -f "pr=$pr"
  verify:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
  attach:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY"
  publish:
    needs: [prepare, verify]
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/job-apply-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
